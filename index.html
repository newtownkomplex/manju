<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>ぼたもち食べるなり</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}body{background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation}.hidden{display:none!important}.intro{flex-direction:column;text-align:center;padding:32px}.record{position:absolute;top:20px;left:20px;font-size:16px;font-weight:700;letter-spacing:.06em}.title{font-size:clamp(25px,7.5vw,46px);font-weight:800;letter-spacing:.06em;white-space:nowrap;margin-bottom:38px}.story{font-size:clamp(16px,4.5vw,22px);line-height:2.05;letter-spacing:.06em}.start{margin-top:44px;padding:14px 46px;border:1px solid #000;background:#000;color:#fff;font:inherit;font-size:18px;letter-spacing:.08em;cursor:pointer;touch-action:manipulation}.black{background:#000;color:#fff;font-size:clamp(44px,13vw,78px);font-weight:800;letter-spacing:.08em}.wake{background:#fff;color:#000;flex-direction:column;gap:10px}.wake-speaker{font-size:clamp(20px,5.5vw,30px);font-weight:700;letter-spacing:.08em}.wake-message{font-size:clamp(42px,12vw,72px);font-weight:800;letter-spacing:.08em}.game{background:#fff}.night,.score,.timer{position:absolute;top:20px;font-size:18px;font-weight:700;letter-spacing:.06em}.night{left:20px}.timer{left:50%;transform:translateX(-50%)}.score{right:20px}.items{position:absolute;inset:80px 24px 130px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}.item{font-size:clamp(48px,14vw,82px);line-height:1;user-select:none;-webkit-user-select:none}.controls{position:absolute;left:20px;right:20px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:12px}.controls button{flex:1;height:58px;border:1px solid #000;background:#fff;color:#000;font:inherit;font-size:20px;font-weight:700;letter-spacing:.08em;cursor:pointer;touch-action:manipulation}.controls button:active,.start:active,.result button:active{background:#000;color:#fff}.result{flex-direction:column;text-align:center}.result-title{font-size:clamp(54px,16vw,88px);font-weight:800;letter-spacing:.08em}.sub{margin-top:24px;font-size:16px;letter-spacing:.06em}.result button{margin-top:42px;padding:15px 48px;border:1px solid #000;background:#000;color:#fff;font:inherit;font-size:18px;font-weight:700;letter-spacing:.08em;cursor:pointer;touch-action:manipulation}.fail .result-title{letter-spacing:.02em}.fail-count{margin-top:24px;font-size:18px;font-weight:700;letter-spacing:.06em}
</style>
</head>
<body>
<section id="intro" class="screen intro"><div id="record" class="record">きろく:0こ</div><div class="title">ぼたもち食べるなり</div><div class="story">むかしむかし<br>たいそう食い意地の<br>張る坊主あり<br>師匠にバレずに<br>ぼたもちを食え！</div><button class="start" id="startBtn">はじめる</button></section>
<section id="startBlack" class="screen black hidden">はじめ！</section>
<section id="wake" class="screen wake hidden"><div class="wake-speaker">おしょう</div><div class="wake-message">寝たか？</div></section>
<section id="game" class="screen game hidden"><div id="night" class="night">一夜目</div><div id="timer" class="timer">0.00</div><div id="score" class="score">0</div><div id="items" class="items"></div><div class="controls"><button id="riceBtn">食う</button><button id="candleBtn">消す</button></div></section>
<section id="success" class="screen result success hidden"><div class="result-title">わろし</div><div class="sub">食べたぼたもち：<span id="resultRice">0</span>個</div><button id="againBtn">美味なり</button></section>
<section id="fail" class="screen result fail hidden"><div class="result-title">天誅！！</div><div id="failCount" class="fail-count">たべた：0こ</div><button id="sleepBtn">寝る</button></section>
<script>
const screens={intro:document.getElementById('intro'),black:document.getElementById('startBlack'),wake:document.getElementById('wake'),game:document.getElementById('game'),success:document.getElementById('success'),fail:document.getElementById('fail')};
const items=document.getElementById('items'),nightEl=document.getElementById('night'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer'),resultRice=document.getElementById('resultRice'),recordEl=document.getElementById('record'),failCount=document.getElementById('failCount');
let night=1,totalRice=0,rice=0,candles=0,timerStart=0,transitionTimer=null,timerFrame=null,highest=Number(localStorage.getItem('manjuRecord')||0),failed=false,roundCount=0;
function show(name){Object.values(screens).forEach(s=>s.classList.add('hidden'));screens[name].classList.remove('hidden')}
function updateRecord(){recordEl.textContent=`きろく:${highest}こ`}
function resetAll(){night=1;totalRice=0;updateCounters()}
function updateCounters(){nightEl.textContent=night===1?'一夜目':`${night}夜目`;scoreEl.textContent=totalRice}
function begin(){failed=false;show('black');clearTimeout(transitionTimer);cancelAnimationFrame(timerFrame);transitionTimer=setTimeout(()=>{show('wake');transitionTimer=setTimeout(startRound,2000+Math.random()*2000)},2000)}
function startRound(){if(failed)return;roundCount++;rice=Math.floor(Math.random()*4);candles=1+Math.floor(Math.random()*2);items.innerHTML='';for(let i=0;i<rice;i++)addItem('🍡','rice');for(let i=0;i<candles;i++)addItem('🕯️','candle');if(roundCount>=5){const interval=5+Math.floor(Math.random()*6);if(roundCount%interval===0)addItem('🐭','mouse')}updateCounters();timerStart=performance.now();show('game');timerEl.textContent='0.00';timerFrame=requestAnimationFrame(updateTimer)}
function updateTimer(now){if(failed||!timerStart)return;const elapsed=(now-timerStart)/1000;timerEl.textContent=elapsed.toFixed(2);if(elapsed>=2){triggerFail();return}timerFrame=requestAnimationFrame(updateTimer)}
function addItem(icon,type){const el=document.createElement('div');el.className='item '+type;el.dataset.type=type;el.textContent=icon;items.appendChild(el)}
function triggerFail(){if(failed)return;failed=true;clearTimeout(transitionTimer);cancelAnimationFrame(timerFrame);timerFrame=null;timerStart=0;failCount.textContent=`たべた：${totalRice}こ`;resetAll();show('fail')}
function eat(){if(failed)return;const el=items.querySelector('[data-type="rice"]');if(!el){triggerFail();return}el.remove();rice--;totalRice++;scoreEl.textContent=totalRice}
function extinguish(){if(failed)return;const el=items.querySelector('[data-type="candle"]');if(!el){triggerFail();return}el.remove();candles--;if(candles===0)finish()}
function finish(){if(failed)return;const elapsed=(performance.now()-timerStart)/1000;cancelAnimationFrame(timerFrame);timerFrame=null;timerStart=0;if(elapsed>2){triggerFail();return}if(totalRice>highest){highest=totalRice;localStorage.setItem('manjuRecord',highest);updateRecord()}resultRice.textContent=totalRice;show('success')}
function retry(){night++;updateCounters();begin()}
function failRestart(){resetAll();show('intro');updateRecord()}
document.getElementById('startBtn').onclick=begin;document.getElementById('riceBtn').onclick=eat;document.getElementById('candleBtn').onclick=extinguish;document.getElementById('againBtn').onclick=retry;document.getElementById('sleepBtn').onclick=failRestart;updateCounters();updateRecord();
</script>
</body>
</html>
